[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-tracker-api"
version = "0.1.0"
description = "Internal bug tracking and QA progress API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pymysql>=1.1,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.4,<3.0",
  "PyJWT>=2.9,<3.0",
  "argon2-cffi>=23.1,<24.0",
  "email-validator>=2.2,<3.0",
  "slowapi>=0.1.9,<1.0",
  "google-api-python-client>=2.145,<3.0",
  "google-auth>=2.35,<3.0",
  "google-auth-oauthlib>=1.2,<2.0",
  "tenacity>=9.0,<10.0",
  "python-multipart>=0.0.12,<1.0",
  "filetype>=1.2,<2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1.0", "pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
